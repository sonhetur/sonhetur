name: Deploy SonheTur to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Permissões necessárias para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita múltiplos deploys simultâneos conflitantes
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Compilar Projeto (Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci || npm install

      - name: Compilar site estático para produção
        run: npx vite build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefatos de compilação
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    name: Publicar no GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy oficial para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
